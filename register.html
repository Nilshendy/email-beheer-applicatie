<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren - Email Beheer</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <!-- Notification Container -->
        <div class="notification-container" id="notificationContainer"></div>

        <div class="auth-box">
            <button class="login-toggle">Registeren</button>
            
            <div class="auth-icon">
                <i class="fas fa-envelope"></i>
            </div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" name="email" required placeholder="voer uw e-mail in">
                </div>
                
                <div class="form-group">
                    <label for="reg-password">Wachtwoord</label>
                    <input type="password" id="reg-password" name="password" required placeholder="voer uw wachtwoord in">
                </div>
                
                <div class="form-group">
                    <label for="reg-confirm-password">Bevestig wachtwoord</label>
                    <input type="password" id="reg-confirm-password" name="confirm-password" required placeholder="bevestig uw wachtwoord">
                </div>
                
                <button type="submit" class="auth-btn login-btn">Log in</button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
